name: CI

on:
  push:
    branches: ["*"]
  pull_request:
    branches: ["*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4

      - name: Docker Build
        run: docker build -t crazyuploader/pinger:latest .
        
      - name: Docker Compose Run
        run: |
          cp .env-example .env
          docker-compose up --detach

      - name: Run ShellCheck
        run: shellcheck *.sh
