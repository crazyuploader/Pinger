name: CI

on:
  push:
    branches: ["*"]
  pull_request:
    branches: ["*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@a5ac7e51b41094c92402da3b24376905380afc29 # v4

      - name: Docker Build
        run: docker build -t crazyuploader/pinger:latest .
        
      - name: Docker Compose Run
        run: |
          cp .env-example .env
          docker-compose up --detach

      - name: Run ShellCheck
        run: shellcheck *.sh
